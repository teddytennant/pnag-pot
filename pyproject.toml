[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pnag-pot"
version = "0.1.0"
description = "Proximal Nesterov for quadratically or elastic-net regularized partial optimal transport"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jax"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
